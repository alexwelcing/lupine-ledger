name: Lupine Ledger CI / Deploy

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'README.md'
      - 'content/**'
      - 'src/**'
      - 'scripts/**'
      - 'Dockerfile'
      - 'nginx.conf'
      - 'cloudbuild.yaml'
      - 'wrangler.toml'
      - 'package*.json'
      - '.github/workflows/deploy.yml'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'content/**'
      - 'src/**'
      - 'scripts/**'
      - 'Dockerfile'
      - 'nginx.conf'
      - 'cloudbuild.yaml'
      - 'wrangler.toml'
      - 'package*.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: {}

concurrency:
  group: lupine-ledger-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify content and build Pages output
        run: npm run pages:build
        env:
          LIBRARY_BUILD_VERSION: ${{ github.sha }}

  deploy:
    needs: verify
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Pages output
        run: npm run pages:build
        env:
          LIBRARY_BUILD_VERSION: ${{ github.sha }}

      - name: Validate deployment secrets
        run: |
          miss=0
          [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ] && { echo "::error::MISSING SECRET: CLOUDFLARE_ACCOUNT_ID"; miss=1; }
          [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] && { echo "::error::MISSING SECRET: CLOUDFLARE_API_TOKEN"; miss=1; }
          exit $miss

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name=lupine-ledger --branch="$GITHUB_REF_NAME" --commit-dirty=true
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Report deploy status
        if: always()
        run: |
          curl -X POST https://glim-think-v1.aw-ab5.workers.dev/ops/report \
            -H "Content-Type: application/json" \
            -d "{\"repo\":\"$GITHUB_REPOSITORY\",\"workflow\":\"$GITHUB_WORKFLOW\",\"run_id\":\"$GITHUB_RUN_ID\",\"status\":\"${{ job.status }}\",\"commit_sha\":\"$GITHUB_SHA\",\"branch\":\"$GITHUB_REF_NAME\",\"service\":\"library.lupine.site\",\"platform\":\"cloudflare-pages\",\"run_url\":\"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\",\"started_at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" || true
